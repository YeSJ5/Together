# ==============================================================================
# TOGETHER — Production Coturn TURN Relay Configuration
# ==============================================================================
# RFC 5766 REST API Shared-Secret Ephemeral Authentication
# Compatible with TOGETHER backend/src/iceConfig.js
# ==============================================================================

# Listening IP addresses (0.0.0.0 binds to all available interfaces)
listening-ip=0.0.0.0

# Standard WebRTC STUN/TURN ports
listening-port=3478
tls-listening-port=5349

# External Public IP of the VPS (Uncomment and replace with your VPS public IP)
# external-ip=YOUR_SERVER_PUBLIC_IP

# Ephemeral UDP relay port range for WebRTC media streams
min-port=49152
max-port=65535

# Server domain / realm
realm=turn.together-audio.live
server-name=together-turn

# RFC 5766 REST API Shared Secret Authentication
use-auth-secret
static-auth-secret=REPLACE_WITH_STRONG_GENERATED_SECRET

# Long-term credential mechanism & message integrity
lt-cred-mech
fingerprint

# Security Hardening & Abuse Controls (Prevent SSRF, loopback attacks, and cloud metadata access)
no-loopback-peers
no-multicast-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Drop privileges to turnserver user
proc-user=turnserver
proc-group=turnserver

# TLS / TURNS Certificates (Uncomment after Certbot generates Let's Encrypt certificates)
# cert=/etc/letsencrypt/live/turn.together-audio.live/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.together-audio.live/privkey.pem

# Logging & Performance
syslog
verbose
no-stdout-log
max-allocate-timeout=3600
stale-nonce=600
